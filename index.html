<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flex Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='4' width='20' height='13' rx='3' fill='%233d63dd'/%3E%3Cpath d='M8 21h8' stroke='%233d63dd' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=11">
  <!-- Bump v when modules change: browsers may hold copies cached before the dev
       server sent no-store, and a mix of old and new modules fails silently. -->
  <script type="importmap">
  {
    "imports": {
      "./app.js": "./app.js?v=9", "./brands.js": "./brands.js?v=9", "./catalog.js": "./catalog.js?v=9",
      "./checks.js": "./checks.js?v=9", "./dock.js": "./dock.js?v=9", "./export.js": "./export.js?v=9",
      "./glyphs.js": "./glyphs.js?v=9", "./icons.js": "./icons.js?v=9", "./ini.js": "./ini.js?v=9",
      "./looks.js": "./looks.js?v=9", "./presets.js": "./presets.js?v=9", "./stage.js": "./stage.js?v=9",
      "./zip.js": "./zip.js?v=9"
    }
  }
  </script>
  <script>
    // Show start-up failures on the page, so a broken load is not a silent dead button.
    function fsShowError(msg) {
      var box = document.getElementById('boot-error');
      if (!box) return;
      box.hidden = false;
      box.querySelector('code').textContent = msg;
    }
    window.addEventListener('error', function (e) { fsShowError(e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); });
    window.addEventListener('unhandledrejection', function (e) { fsShowError(String(e.reason && e.reason.stack || e.reason)); });
  </script>
  <script type="module">import './app.js';</script>
</head>
<body>
  <div class="boot-error" id="boot-error" role="alert" hidden>
    <strong>Something failed in Flex Studio.</strong>
    <span>Reload with Cmd+Shift+R. If it stays, send this text:</span>
    <code></code>
  </div>
  <header class="appbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="3" fill="currentColor"/><path d="M8 21h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span><strong>Flex Studio</strong><small>for Flex Launcher 2.2</small></span>
    </div>
    <label class="preset">
      <span class="sr-only">Preset</span>
      <select id="preset"></select>
    </label>
    <div class="styles-anchor">
      <button type="button" class="btn" id="styles-btn" aria-expanded="false" aria-controls="styles-pop">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
        Styles
      </button>
      <div class="popover" id="styles-pop" role="dialog" aria-label="Styles" hidden>
        <p class="pop-head"><strong>Styles</strong><span>Changes only the look. Apps and keys stay.</span></p>
        <div class="style-grid" id="styles-grid"></div>
      </div>
    </div>
    <button type="button" class="health" id="health"></button>
    <span class="grow"></span>
    <span class="sim-note">Simulation · nothing runs on the box</span>
    <button type="button" class="icon-btn" id="theme" aria-label="Theme"></button>
    <button type="button" class="btn primary" id="export-quick">Export</button>
  </header>

  <div class="shell">
    <nav class="rail" aria-label="Steps" id="rail"></nav>

    <main class="stage-area" aria-label="TV preview">
      <div class="tv-head" id="tv-head"></div>
      <div class="tv" id="stage" tabindex="0" role="application" aria-roledescription="TV preview"
           aria-label="TV preview. Arrow keys move, Enter opens, Backspace goes back, Esc closes an app. Click an app to edit it."></div>
      <div class="remote" role="group" aria-label="Remote" id="remote"></div>
      <details class="activity" id="activity">
        <summary>Activity</summary>
        <ol id="events" reversed></ol>
      </details>
    </main>

    <aside class="panel" aria-labelledby="panel-title">
      <header class="panel-head">
        <h2 id="panel-title"></h2>
        <p id="panel-desc"></p>
      </header>
      <div class="panel-body" id="panel"></div>
    </aside>
  </div>

  <dialog id="catalog" aria-labelledby="catalog-title">
    <form method="dialog" class="dialog-head">
      <h2 id="catalog-title">Add an app</h2>
      <button class="icon-btn" value="close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </form>
    <input type="search" id="catalog-search" placeholder="Search apps" aria-label="Search apps">
    <div id="catalog-body" class="catalog-body"></div>
  </dialog>

  <div class="toast" role="status" aria-live="polite" id="toast"></div>
</body>
</html>
