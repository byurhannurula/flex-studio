<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Flex Studio</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3f4f6;
        --text: #14161b;
        --muted: #687080;
        --accent: #3d63dd;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e0f12;
          --text: #eceef2;
          --muted: #8e95a3;
          --accent: #8ba5ff;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.5 system-ui,
          sans-serif;
      }
      main {
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 20px;
        margin: 16px 0 4px;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
      }
      a {
        color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/logo.svg" width="56" height="56" alt="" />
      <h1>This page does not exist</h1>
      <p>Flex Studio has only one page.</p>
      <a href="/">Open Flex Studio</a>
    </main>
  </body>
</html>
